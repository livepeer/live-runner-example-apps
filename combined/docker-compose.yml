# One on-chain orchestrator serving BOTH runners at once:
#   - vLLM   (GPU) as a static runner from runners.json  -> app vllm/qwen2.5-0.5b-instruct
#   - ffmpeg (CPU) self-registering                       -> app livepeer/ffmpeg
# So the OpenAI gateway (model) and the MCP server (ffmpeg) both hit :8935.
# Payment is done by the CLEARINGHOUSE signer via the gateway/MCP — no bundled signer here.
#
#   cp ../vllm/.env .env   # NETWORK / ETH_RPC_URL / ORCH_* / PRICE_PER_UNIT / PIXELS_PER_UNIT
#   docker compose up -d --build
#   curl -sk https://localhost:8935/discovery | jq '.[].runners[].app'  # both apps

services:
  orchestrator:
    image: livepeer/go-livepeer:ja-live-runner
    container_name: combined_orchestrator
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=${NETWORK}
      - -ethUrl=${ETH_RPC_URL}
      - -ethKeystorePath=/keystore
      - -ethAcctAddr=${ORCH_ETH_ACCT}
      - -ethPassword=${ORCH_ETH_PASSWORD}
      - -ethOrchAddr=${ORCH_ONCHAIN_ADDR}
      - -pricePerUnit=0
      - -ticketEV=1000000000000
      - -liveRunnerConfig=/config/runners.json
      - -monitor=false
      - -v=6
    ports:
      - "8935:8935"
    volumes:
      - ${ORCH_KEYSTORE_DIR}:/keystore:ro
      - ./runners.json:/config/runners.json:ro
    healthcheck:
      test: printf 'GET /healthz HTTP/1.0\r\n\r\n' | openssl s_client -connect 127.0.0.1:8935 -quiet 2>/dev/null | grep -q '200 OK'
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  vllm:
    image: vllm/vllm-openai:latest
    container_name: combined_vllm
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.5}"
      # Enable OpenAI tool-calling (agents send `tools`; without this vLLM 500s).
      # `hermes` is the correct parser for the Qwen2.5 family.
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  ffmpeg:
    build: ../ffmpeg
    container_name: combined_ffmpeg
    depends_on:
      orchestrator:
        condition: service_healthy
    command:
      - python
      - runner.py
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://ffmpeg:5000
      - --price=${PRICE_PER_UNIT}
      - --pixels-per-unit=${PIXELS_PER_UNIT}
