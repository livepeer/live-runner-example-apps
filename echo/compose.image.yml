# Run the published image instead of building. Layer it on the offchain base:
#   docker compose -f compose.yml -f compose.image.yml up -d
#
# Both fields have to change together: naming the image without forcing the pull
# would build from source and tag the result as the published image. An overlay
# cannot be half-applied, which is why this is a file and not two env vars.
# Stacks with the on-chain overlay too:
#   docker compose -f compose.yml -f compose.onchain.yml -f compose.image.yml up -d

services:
  app:
    image: ghcr.io/livepeer/runner-example-echo:latest
    pull_policy: always
