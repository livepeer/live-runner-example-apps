# On-chain payment overlay for the realtime transcode example. Layer on the base:
#   docker compose -f docker-compose.yml -f docker-compose.onchain.yml up -d --build
#
# Adds the shared remote signer, re-points the orchestrator on-chain, and
# registers the app with a price. Trickle rides a reserved (metered) session:
# reserve_session pays at reserve, the meter runs while the stream is open.
# Requires a local .env (gitignored). Then pay through the signer:
#   uv run client.py clip.mp4 --discovery https://localhost:8935/discovery \
#     --signer http://localhost:7936 --height 360 --output out.ts

services:
  signer:
    extends:
      file: ../compose.onchain.yml
      service: signer
    ports:
      - "7936:7936"

  orchestrator:
    extends:
      file: ../compose.onchain.yml
      service: orchestrator

  # Re-declare the command to advertise a price (base file registers free).
  app:
    command:
      - python
      - runner.py
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:8990
      - --height=${TRANSCODE_HEIGHT:-360}
      - --price=${PRICE_PER_UNIT}
      - --pixels-per-unit=${PIXELS_PER_UNIT}
