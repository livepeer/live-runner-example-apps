# Offchain demo: orchestrator + the audio-diarized-transcription-runner, attached
# as a STATIC runner via runners.json. The orchestrator health-polls /healthz and
# reverse-proxies the runner's HTTP + WebSocket endpoints. Requires an NVIDIA GPU.
#
# Two ways to test (see README.md):
#   Direct   — client.py hits the runner on :8080, no orchestrator involved.
#   Session  — session.py reserves ONE session and drives multipart HTTP + WS
#              through the orchestrator (discovery on :8935).
#   docker compose up -d
#
# The runner image is built from the runner's own repo (not published yet):
#   git clone https://github.com/moatus/audio-diarized-transcription-runner
#   cd audio-diarized-transcription-runner && ./build-images.sh build

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator
    # `extends` can't append a single flag to `command`, so it's restated here
    # with -liveRunnerConfig added and runners.json mounted in.
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=offchain
      - -monitor=false
      - -liveRunnerConfig=/config/runners.json
      - -v=6
    volumes:
      - ./runners.json:/config/runners.json:ro

  audio_diarized_transcription_runner:
    image: ${REGISTRY:-moatus}/audio-diarized-transcription-runner:${TAG:-v0.1.0}
    container_name: example_apps_audio_diarized_transcription
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - RUNNER_PORT=8080
      - DEVICE=${NEMO_DEVICE:-cuda}
      - CAPABILITY_NAME=openai:audio-transcriptions
      - MODEL_CACHE_DIR=/models
      # Bounded route holds one job at a time; a 2nd concurrent call gets 429.
      # Bump this if you want parallelism (each job needs its own VRAM headroom).
      - MAX_QUEUE_SIZE=${NEMO_MAX_QUEUE_SIZE:-1}
      - MAX_AUDIO_MB=${NEMO_MAX_AUDIO_MB:-100}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # NeMo / Hugging Face / torch caches persist here so weights download once.
      - audio-diarized-transcription-models:/models
      - audio-diarized-transcription-nemo-cache:/root/.cache/torch/NeMo
    # Published for the direct client.py path; the orchestrator reaches the runner
    # over the compose network (see runner_url in runners.json), not this port.
    ports:
      - "${RUNNER_PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  audio-diarized-transcription-models: {}
  audio-diarized-transcription-nemo-cache: {}
