# Offchain demo: orchestrator + the official vLLM image, with vLLM attached as a
# static runner via runners.json (-liveRunnerConfig). Requires an NVIDIA GPU.
# The gateway + OpenAI client run on the host (see README.md / gateway.py).
#   docker compose up -d
#   uv run gateway.py &                  # OpenAI endpoint on :8080 (host)
#   uv run client.py --prompt "Hello!"   # stock openai -> the gateway

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator
    # `extends` can't append a single flag to `command`, so the command is
    # restated here with -liveRunnerConfig added and runners.json mounted in.
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=offchain
      - -monitor=false
      - -liveRunnerConfig=/config/runners.json
      - -v=6
    volumes:
      - ./runners.json:/config/runners.json:ro

  vllm:
    image: vllm/vllm-openai:latest
    container_name: example_apps_vllm
    # Pinned, not a knob: runners.json advertises this model by name, so change both
    # together. --gpu-memory-utilization caps VRAM (0.9 default can exceed free).
    command:
      - "--model"
      - "Qwen/Qwen2.5-0.5B-Instruct"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.5}"
    environment:
      # Only needed for gated models; leave empty otherwise.
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    # vLLM needs an NVIDIA GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # The orchestrator health-polls vLLM's /health (runners.json); this gates
      # local `depends_on` and mirrors what the orchestrator checks.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 60 # model download + load can take a while
      start_period: 20s
