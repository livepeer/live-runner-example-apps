# End-to-end offchain demo: orchestrator + tiles app (capacity fan-out).
#
# The orchestrator service is defined once in ../compose.orchestrator.yml and
# pulled in with `extends`; this file only adds the app. CAPACITY (default 4)
# sets the runner's advertised capacity — the knob this example showcases:
#   CAPACITY=1 docker compose up -d --build   # tiles serialize
#   uv run client.py photo.jpg --discovery https://localhost:8935/discovery
#   docker compose down
#   CAPACITY=9 docker compose up -d --build   # tiles run in parallel (same output, faster)

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator

  app:
    # Builds from source by default, rebuilding on every `up` so an edit is
    # never silently ignored (the layer cache keeps that cheap). To run the
    # published image instead of building:
    #   APP_IMAGE=ghcr.io/livepeer/runner-example-tiles:latest \
    #     APP_PULL_POLICY=always docker compose up -d
    image: ${APP_IMAGE:-runner-example-tiles:local}
    pull_policy: ${APP_PULL_POLICY:-build}
    build: .
    container_name: example_apps_tiles
    # Wait for the orchestrator's healthcheck so registration doesn't race its boot.
    depends_on:
      orchestrator:
        condition: service_healthy
    command:
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:8989
      - --capacity=${CAPACITY:-4}
