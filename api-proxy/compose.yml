# End-to-end offchain demo: orchestrator + the api-proxy "app" — a stock nginx
# attached as two static runners via runners.json (-liveRunnerConfig). There is
# no app code at all: nginx.conf.template is the whole runner, and it serves two
# capabilities from one process because a capability is a registration.
#
# Needs HF_TOKEN (the upstream credential nginx injects) in a local .env — copy
# .env.example. Once up, call it from the host with the SDK:
#   docker compose up -d
#   uv run client.py --prompt "..." --discovery https://localhost:8935/discovery

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator
    # `extends` can't append a single flag to `command`, so the command is
    # restated here with -liveRunnerConfig added and runners.json mounted in.
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=offchain
      - -monitor=false
      - -liveRunnerConfig=/config/runners.json
      - -v=6
    volumes:
      - ./runners.json:/config/runners.json:ro

  app:
    image: nginx:1.27-alpine
    container_name: example_apps_api_proxy
    environment:
      # The operator-held upstream credential (huggingface.co → settings → tokens).
      - HF_TOKEN=${HF_TOKEN:?set HF_TOKEN in .env (copy .env.example)}
      # One model per route in nginx.conf.template. Swap one here and rename its
      # app id in runners.json to match (the app id is what callers discover).
      - MODEL_SD3=stabilityai/stable-diffusion-3-medium-diffusers
      # Faster and cheaper than sd3 — which is why it is a separate capability
      # at a separate price rather than a flag on the first one.
      - MODEL_FLUX=black-forest-labs/FLUX.1-schnell
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
