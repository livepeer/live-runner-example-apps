# End-to-end offchain demo: orchestrator + hello-world app.
#
# The orchestrator service is defined once in ../compose.orchestrator.yml and
# pulled in with `extends`; this file only adds the app. Once up, call it from
# the host with the SDK:
#   docker compose up -d --build
#   uv run client.py --name livepeer --discovery https://localhost:8935/discovery

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator

  app:
    # Builds from source by default, rebuilding on every `up` so an edit is
    # never silently ignored (the layer cache keeps that cheap). To run the
    # published image instead of building:
    #   APP_IMAGE=ghcr.io/livepeer/runner-example-hello-world:latest \
    #     APP_PULL_POLICY=always docker compose up -d
    image: ${APP_IMAGE:-runner-example-hello-world:local}
    pull_policy: ${APP_PULL_POLICY:-build}
    build: .
    container_name: example_apps_hello_world
    # Wait for the orchestrator's healthcheck so registration doesn't race its boot.
    depends_on:
      orchestrator:
        condition: service_healthy
    command:
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:8989
