[project]
name = "livepeer-live-transcode"
version = "0.1.0"
description = "Realtime trickle transcoding example app for the Livepeer network."
requires-python = ">=3.12"
dependencies = [
    "aiohttp",          # gateway.py serves HLS
    "av",               # decode the source / RTMP ingest
    "livepeer-gateway",
]

# livepeer-gateway is not on PyPI yet; pull it from the branch.
[tool.uv.sources]
livepeer-gateway = { git = "https://github.com/livepeer/livepeer-python-gateway", branch = "ja/live-runner" }
