[project]
name = "livepeer-remote-mcp"
version = "0.1.0"
description = "Remote HTTP MCP server for Livepeer ffmpeg (bearer-token auth)."
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "uvicorn",
    "starlette",
    "requests",
    "livepeer-gateway",
    "livepeer-gateway-client",
]

[tool.uv.sources]
livepeer-gateway = { git = "https://github.com/livepeer/livepeer-python-gateway", rev = "81ee7bee7932afe94c882a560e5a8bdba1f2cb04" }
livepeer-gateway-client = { git = "https://github.com/pymthouse/livepeer-gateway-client", rev = "8035d8514bf5048f380e48b98849472492de2e27" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
