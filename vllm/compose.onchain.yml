# On-chain payment overlay for vllm. Layer it on the offchain base:
#   docker compose -f compose.yml -f compose.onchain.yml up -d
#
# Adds the shared remote signer, re-points the orchestrator on-chain (see
# ../compose.onchain.yml), and mounts runners.json so the statically attached
# runner advertises a price and the orchestrator issues a payment challenge.
# Requires a local .env (gitignored); copy .env.example and fill it in. Then the
# gateway pays per call through the signer:
#   uv run gateway.py --signer http://localhost:7936 &
#   uv run client.py --prompt "Hello!"

services:
  signer:
    extends:
      file: ../compose.onchain.yml
      service: signer
    ports:
      - "7936:7936"

  orchestrator:
    extends:
      file: ../compose.onchain.static.yml
      service: orchestrator
    volumes:
      - ${ORCH_KEYSTORE_DIR}:/keystore:ro
      - ./runners.json:/config/runners.json:ro
