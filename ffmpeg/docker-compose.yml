# Offchain demo: orchestrator + a multi-op ffmpeg tool app that self-registers
# (dynamic) and runs an ffmpeg op on a posted file.
#
#   docker compose up -d --build
#   uv run client.py --op transcode --height 480 --input clip.mp4 --output out.mp4
#
# The orchestrator is defined once in ../compose.orchestrator.yml and pulled in
# with `extends`. The app embeds the SDK and registers itself, like hello-world.
# CPU (libx264) by default; see the README to enable GPU (h264_nvenc).

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator

  app:
    build: .
    container_name: example_apps_ffmpeg
    # Wait for the orchestrator's healthcheck so registration doesn't race its boot.
    depends_on:
      orchestrator:
        condition: service_healthy
    command:
      - python
      - runner.py
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:5000
    # GPU: layer docker-compose.gpu.yml — no edits here (see that file / README).
