[project]
name = "livepeer-tiles"
version = "0.1.0"
description = "Tiles (capacity fan-out) example app for the Livepeer network."
requires-python = ">=3.12"
dependencies = [
    "fastapi",          # runner: routes + generated OpenAPI schema
    "uvicorn",          # runner: ASGI server
    "opencv-python-headless",  # runner: stylize tiles; client: split/stitch
    "numpy",
    "aiohttp",
    "livepeer-gateway",
]

# livepeer-gateway is not on PyPI yet; pull it from the branch.
[tool.uv.sources]
livepeer-gateway = { git = "https://github.com/livepeer/livepeer-python-gateway", branch = "main" }
