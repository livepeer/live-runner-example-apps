# On-chain payment overlay for api-proxy. Layer it on the offchain base:
#   docker compose -f compose.yml -f compose.onchain.yml up -d --build
#
# Adds the shared remote signer and re-points the orchestrator on-chain (see
# ../compose.onchain.yml), with runners.json mounted so the statically attached
# runner advertises its fixed price and the orchestrator issues a payment
# challenge. Requires a local .env (gitignored); copy .env.example and fill it
# in. Then pay through the signer:
#   uv run client.py --prompt "..." \
#     --discovery https://localhost:8935/discovery \
#     --signer http://localhost:7936

services:
  signer:
    extends:
      file: ../compose.onchain.yml
      service: signer
    ports:
      - "7936:7936"

  orchestrator:
    extends:
      file: ../compose.onchain.yml
      service: orchestrator
    # Same flags as ../compose.onchain.yml, restated to add -liveRunnerConfig
    # (`extends` can't append one) + mount runners.json.
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=${NETWORK}
      - -ethUrl=${ETH_RPC_URL}
      - -ethKeystorePath=/keystore
      - -ethAcctAddr=${ORCH_ETH_ACCT}
      - -ethPassword=${ORCH_ETH_PASSWORD}
      - -ethOrchAddr=${ORCH_ONCHAIN_ADDR}
      # Price comes from the app's registration; -pricePerUnit only sets the
      # unused legacy base price, but an on-chain O won't boot without it.
      - -pricePerUnit=0
      - -ticketEV=10000000000
      - -maxFaceValue=4000000000000000
      - -liveRunnerConfig=/config/runners.json
      - -monitor=false
      - -v=6
    volumes:
      - ${ORCH_KEYSTORE_DIR}:/keystore:ro
      - ./runners.json:/config/runners.json:ro
