[project]
name = "livepeer-ffmpeg"
version = "0.1.0"
description = "Multi-op ffmpeg tool example app (tool -> agent) for the Livepeer network."
requires-python = ">=3.12"
dependencies = [
    "livepeer-gateway",
    "mcp",  # for mcp_server.py — the Claude (MCP) integration
]

# livepeer-gateway is not on PyPI yet; pull it from the branch.
[tool.uv.sources]
livepeer-gateway = { git = "https://github.com/livepeer/livepeer-python-gateway", branch = "ja/live-runner" }
