# On-chain payment overlay for the ffmpeg tool example. Layer on the base:
#   docker compose -f docker-compose.yml -f docker-compose.onchain.yml up -d --build
#
# Adds the shared remote signer, re-points the orchestrator on-chain, and
# registers the app with a price. Requires a local .env (gitignored); copy
# .env.example and fill it in. Then pay through the signer:
#   uv run client.py --op transcode --height 480 --input clip.mp4 --output out.mp4 \
#     --discovery https://localhost:8935/discovery --signer http://localhost:7936

services:
  signer:
    extends:
      file: ../compose.onchain.yml
      service: signer
    ports:
      - "7936:7936"

  orchestrator:
    extends:
      file: ../compose.onchain.yml
      service: orchestrator

  # Re-declare the command to advertise a price (base file registers free).
  app:
    command:
      - python
      - runner.py
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:5000
      - --price=${PRICE_PER_UNIT}
      - --pixels-per-unit=${PIXELS_PER_UNIT}
