# On-chain (paid) overlay for flux-klein. Layer it on the offchain base:
#   docker compose -f docker-compose.yml -f docker-compose.onchain.yml up -d --build
#
# Adds the shared remote signer and re-points the orchestrator on-chain (see
# ../compose.onchain.yml). The price is already in runners.json (static runner),
# so unlike the dynamic hello-world example there's no --price on the app.
# Requires a local .env (gitignored); copy .env.example and fill it in. Pay
# through the signer:
#   uv run client.py --webcam /dev/video0 \
#     --discovery https://localhost:8935/discovery \
#     --signer http://localhost:7936 --output out.ts

services:
  signer:
    extends:
      file: ../compose.onchain.yml
      service: signer
    ports:
      - "7936:7936"

  orchestrator:
    extends:
      file: ../compose.onchain.yml
      service: orchestrator
    # extends copies the on-chain command; compose replaces command lists (can't
    # append), so restate it here WITH -liveRunnerConfig, and re-mount runners.json
    # next to the keystore (a static runner needs the config in the on-chain path too).
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=${NETWORK}
      - -ethUrl=${ETH_RPC_URL}
      - -ethKeystorePath=/keystore
      - -ethAcctAddr=${ORCH_ETH_ACCT}
      - -ethPassword=${ORCH_ETH_PASSWORD}
      - -ethOrchAddr=${ORCH_ONCHAIN_ADDR}
      - -pricePerUnit=0
      - -ticketEV=1000000000000
      - -liveRunnerConfig=/config/runners.json
      - -monitor=false
      - -v=6
    volumes:
      - ${ORCH_KEYSTORE_DIR}:/keystore:ro
      - ./runners.json:/config/runners.json:ro
