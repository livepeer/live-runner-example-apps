# End-to-end offchain demo: orchestrator + the api-proxy "app" — a stock nginx
# attached as a static runner via runners.json (-liveRunnerConfig). There is no
# app code at all: nginx.conf.template is the whole runner.
#
# Needs FAL_KEY (the upstream credential nginx injects) in a local .env — copy
# .env.example. Once up, call it from the host with the SDK:
#   docker compose up -d
#   uv run client.py --prompt "..." --discovery https://localhost:8935/discovery

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator
    # `extends` can't append a single flag to `command`, so the command is
    # restated here with -liveRunnerConfig added and runners.json mounted in.
    command:
      - -orchestrator
      - -useLiveRunners
      - -serviceAddr=127.0.0.1:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=abcdef
      - -network=offchain
      - -monitor=false
      - -liveRunnerConfig=/config/runners.json
      - -v=6
    volumes:
      - ./runners.json:/config/runners.json:ro

  app:
    image: nginx:1.27-alpine
    container_name: example_apps_api_proxy
    environment:
      # The operator-held upstream credential (fal.ai → dashboard → API keys).
      - FAL_KEY=${FAL_KEY:?set FAL_KEY in .env (copy .env.example)}
      # The one model this runner offers (a fal.ai route); swap it here.
      - MODEL=fal-ai/flux/schnell
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
