[project]
name = "livepeer-echo"
version = "0.1.0"
description = "Echo (trickle realtime video) example app for the Livepeer network."
requires-python = ">=3.12"
dependencies = [
    "av",               # client + runner: decode/encode video frames
    "opencv-python-headless",  # runner: gray/invert/blur transforms
    "aiohttp",
    "livepeer-gateway",
]

# livepeer-gateway is not on PyPI yet; pull it from the branch.
[tool.uv.sources]
livepeer-gateway = { git = "https://github.com/livepeer/livepeer-python-gateway", branch = "ja/live-runner" }
